<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Levantamiento topográfico con drones y precisión fotogramétrica">
  <defs>
    <!-- Cielo: gradiente oscuro a azul profundo -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1424"/>
      <stop offset="60%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1F3A5F"/>
    </linearGradient>

    <!-- Terreno: marrón cálido / arena -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2e22"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>

    <!-- Cono de captura del drone (luz/sensor) -->
    <linearGradient id="cone" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F18A1F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F18A1F" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Brillo del LED del drone -->
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC07A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F18A1F" stop-opacity="0"/>
    </radialGradient>

    <!-- Estrella -->
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Patrón de cuadrícula del terreno (malla fotogramétrica) -->
    <pattern id="grid" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <path d="M 0 0 L 60 0 M 0 0 L 0 30" stroke="#F18A1F" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Cielo -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Estrellas dispersas -->
  <g opacity="0.7">
    <circle cx="120" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="280" cy="50" r="1" fill="#ffffff"/>
    <circle cx="450" cy="110" r="1.5" fill="#ffffff"/>
    <circle cx="780" cy="60" r="1" fill="#ffffff"/>
    <circle cx="950" cy="90" r="1.5" fill="#ffffff"/>
    <circle cx="1080" cy="140" r="1" fill="#ffffff"/>
    <circle cx="180" cy="180" r="1" fill="#ffffff"/>
    <circle cx="1020" cy="40" r="2" fill="url(#star)"/>
    <circle cx="350" cy="160" r="2" fill="url(#star)"/>
  </g>

  <!-- Línea de horizonte sutil con resplandor naranja -->
  <rect x="0" y="395" width="1200" height="2" fill="#F18A1F" opacity="0.4"/>
  <rect x="0" y="392" width="1200" height="8" fill="url(#cone)"/>

  <!-- Terreno -->
  <rect x="0" y="397" width="1200" height="233" fill="url(#ground)"/>

  <!-- Cuadrícula fotogramétrica sobre el terreno (perspectiva) -->
  <g opacity="0.9">
    <!-- Líneas horizontales (más juntas hacia el horizonte) -->
    <line x1="0" y1="410" x2="1200" y2="410" stroke="#F18A1F" stroke-width="0.4" stroke-opacity="0.25"/>
    <line x1="0" y1="425" x2="1200" y2="425" stroke="#F18A1F" stroke-width="0.5" stroke-opacity="0.30"/>
    <line x1="0" y1="445" x2="1200" y2="445" stroke="#F18A1F" stroke-width="0.6" stroke-opacity="0.35"/>
    <line x1="0" y1="470" x2="1200" y2="470" stroke="#F18A1F" stroke-width="0.7" stroke-opacity="0.40"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#F18A1F" stroke-width="0.8" stroke-opacity="0.45"/>
    <line x1="0" y1="535" x2="1200" y2="535" stroke="#F18A1F" stroke-width="1" stroke-opacity="0.50"/>
    <line x1="0" y1="575" x2="1200" y2="575" stroke="#F18A1F" stroke-width="1.2" stroke-opacity="0.55"/>
    <line x1="0" y1="620" x2="1200" y2="620" stroke="#F18A1F" stroke-width="1.4" stroke-opacity="0.60"/>

    <!-- Líneas verticales convergiendo al punto de fuga -->
    <g stroke="#F18A1F" stroke-opacity="0.35">
      <line x1="600" y1="397" x2="-200" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="100" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="300" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="450" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="600" y2="630" stroke-width="0.8"/>
      <line x1="600" y1="397" x2="750" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="900" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="1100" y2="630" stroke-width="0.6"/>
      <line x1="600" y1="397" x2="1400" y2="630" stroke-width="0.6"/>
    </g>
  </g>

  <!-- Cono de captura del dron (haz fotogramétrico) -->
  <polygon points="600,210 380,460 820,460" fill="url(#cone)"/>
  <polygon points="600,210 380,460 820,460" fill="none" stroke="#F18A1F" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Halo del drone -->
  <circle cx="600" cy="200" r="80" fill="url(#led)"/>

  <!-- DRON (vista frontal estilizada) -->
  <g transform="translate(600 200)">
    <!-- Brazos en X -->
    <line x1="-70" y1="-25" x2="70" y2="25" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
    <line x1="-70" y1="25" x2="70" y2="-25" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>

    <!-- Cuerpo central -->
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#1a1a2e" stroke="#F18A1F" stroke-width="1.5"/>

    <!-- Cámara (pequeño cilindro debajo) -->
    <rect x="-9" y="14" width="18" height="9" rx="2" fill="#0f1424" stroke="#F18A1F" stroke-width="1"/>
    <circle cx="0" cy="22" r="2.5" fill="#F18A1F"/>

    <!-- LED frontal -->
    <circle cx="0" cy="-8" r="2" fill="#FFC07A"/>

    <!-- Hélices con anillos giratorios -->
    <g opacity="0.85">
      <!-- Hélice superior izquierda -->
      <circle cx="-70" cy="-25" r="22" fill="none" stroke="#F18A1F" stroke-width="1.5" opacity="0.7"/>
      <line x1="-92" y1="-25" x2="-48" y2="-25" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <line x1="-70" y1="-47" x2="-70" y2="-3" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-70" cy="-25" r="3" fill="#F18A1F"/>

      <!-- Hélice superior derecha -->
      <circle cx="70" cy="-25" r="22" fill="none" stroke="#F18A1F" stroke-width="1.5" opacity="0.7"/>
      <line x1="48" y1="-25" x2="92" y2="-25" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="-47" x2="70" y2="-3" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="-25" r="3" fill="#F18A1F"/>

      <!-- Hélice inferior izquierda -->
      <circle cx="-70" cy="25" r="22" fill="none" stroke="#F18A1F" stroke-width="1.5" opacity="0.7"/>
      <line x1="-92" y1="25" x2="-48" y2="25" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <line x1="-70" y1="3" x2="-70" y2="47" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-70" cy="25" r="3" fill="#F18A1F"/>

      <!-- Hélice inferior derecha -->
      <circle cx="70" cy="25" r="22" fill="none" stroke="#F18A1F" stroke-width="1.5" opacity="0.7"/>
      <line x1="48" y1="25" x2="92" y2="25" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="3" x2="70" y2="47" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="25" r="3" fill="#F18A1F"/>
    </g>
  </g>

  <!-- Marcas de altura a la izquierda -->
  <g font-family="'Open Sans', Arial, sans-serif" fill="#FFC07A" opacity="0.85">
    <line x1="220" y1="200" x2="260" y2="200" stroke="#FFC07A" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="180" y="204" font-size="13" font-weight="600" text-anchor="end">60 m</text>

    <line x1="180" y1="280" x2="220" y2="280" stroke="#FFC07A" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <text x="140" y="284" font-size="12" font-weight="500" text-anchor="end" opacity="0.6">90 m</text>

    <line x1="140" y1="350" x2="180" y2="350" stroke="#FFC07A" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <text x="100" y="354" font-size="11" font-weight="500" text-anchor="end" opacity="0.45">120 m</text>
  </g>

  <!-- Dianas en el terreno -->
  <!-- Diana central (la grande, óptima 33x33) -->
  <g transform="translate(600 525)">
    <rect x="-22" y="-22" width="44" height="44" fill="#ffffff"/>
    <rect x="-22" y="-22" width="22" height="22" fill="#1a1a2e"/>
    <rect x="0" y="0" width="22" height="22" fill="#1a1a2e"/>
    <circle cx="0" cy="0" r="3" fill="#F18A1F"/>
  </g>

  <!-- Diana pequeña izquierda -->
  <g transform="translate(420 480)">
    <rect x="-12" y="-12" width="24" height="24" fill="#ffffff" opacity="0.85"/>
    <rect x="-12" y="-12" width="12" height="12" fill="#1a1a2e"/>
    <rect x="0" y="0" width="12" height="12" fill="#1a1a2e"/>
  </g>

  <!-- Diana mediana derecha -->
  <g transform="translate(800 495)">
    <rect x="-17" y="-17" width="34" height="34" fill="#ffffff" opacity="0.9"/>
    <rect x="-17" y="-17" width="17" height="17" fill="#1a1a2e"/>
    <rect x="0" y="0" width="17" height="17" fill="#1a1a2e"/>
    <circle cx="0" cy="0" r="2" fill="#F18A1F"/>
  </g>

  <!-- Diana lejana 1 -->
  <g transform="translate(280 440)">
    <rect x="-7" y="-7" width="14" height="14" fill="#ffffff" opacity="0.7"/>
    <rect x="-7" y="-7" width="7" height="7" fill="#1a1a2e"/>
    <rect x="0" y="0" width="7" height="7" fill="#1a1a2e"/>
  </g>

  <!-- Diana lejana 2 -->
  <g transform="translate(950 450)">
    <rect x="-9" y="-9" width="18" height="18" fill="#ffffff" opacity="0.75"/>
    <rect x="-9" y="-9" width="9" height="9" fill="#1a1a2e"/>
    <rect x="0" y="0" width="9" height="9" fill="#1a1a2e"/>
  </g>

  <!-- Texto principal -->
  <g font-family="'Open Sans', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="80" font-size="14" font-weight="600" fill="#F18A1F" letter-spacing="3">
      INVESTIGACIÓN · UMSA
    </text>
    <text x="600" y="125" font-size="36" font-weight="800" fill="#ffffff">
      Topografía con Drones
    </text>
    <text x="600" y="160" font-size="20" font-weight="500" fill="#FFC07A">
      Precisión Fotogramétrica · RMSE 3.74 cm
    </text>
  </g>

  <!-- Marca de agua / brand -->
  <g font-family="'Open Sans', Arial, sans-serif" fill="#ffffff" opacity="0.65">
    <text x="1170" y="610" font-size="12" font-weight="600" text-anchor="end">
      soluciones-geomaticas.web.app
    </text>
  </g>
</svg>
